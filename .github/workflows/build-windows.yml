name: Build Windows installer

# Tauri no cross-compila de forma fiable macOS -> Windows para el bundler
# nativo (NSIS/MSI), así que el .exe/.msi real se produce aquí, en un
# runner windows-latest.
#
# - Push a main / manual: solo compila y sube el instalador como artefacto
#   de la corrida (para probar, no toca releases ni el auto-updater).
# - Push de un tag "vX.Y.Z": además publica una GitHub Release firmada con
#   `latest.json`, que es lo que el auto-updater de la app consulta.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Compilar y publicar release (tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PIKIPIKI LAUNCHER ${{ github.ref_name }}"
          releaseBody: "Ver el historial de commits para el detalle de cambios."
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Compilar (solo build, sin release)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target x86_64-pc-windows-msvc

      - name: Subir instalador como artefacto de la corrida
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
